<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <a routerLink="/" class="flex items-center gap-2 text-xl font-semibold tracking-tight">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-500 text-base font-bold">KR</span>
        Kouru Studio
      </a>
      <nav class="flex items-center gap-4 text-sm">
        <a routerLink="/spaces" class="transition hover:text-brand-300">Spaces</a>
        <a routerLink="/marketplace" class="transition hover:text-brand-300">Marketplace</a>
        <a routerLink="/account" class="transition hover:text-brand-300">Account</a>
      </nav>
      <div class="flex items-center gap-3 text-sm">
        <ng-container *ngIf="user$ | async as user; else guest">
          <span class="hidden sm:inline text-slate-300">{{ user.displayName }}</span>
          <button type="button" class="btn-secondary" (click)="logout()">Sign out</button>
        </ng-container>
        <ng-template #guest>
          <a routerLink="/login" class="btn-secondary">Sign in</a>
          <a routerLink="/signup" class="btn">Create account</a>
        </ng-template>
      </div>
    </div>
  </header>

  <main class="mx-auto flex max-w-7xl flex-1 flex-col px-6 py-8">
    <router-outlet />
  </main>
</div>
