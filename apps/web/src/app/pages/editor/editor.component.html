<div class="flex items-center justify-between border-b border-slate-800 pb-4">
  <div>
    <a routerLink="['/spaces', (spaceId$ | async)]" class="text-sm text-brand-300">← Back to space</a>
    <h1 class="mt-2 text-2xl font-semibold" *ngIf="project$ | async as project">{{ project.name }}</h1>
  </div>
  <div class="flex gap-2">
    <button class="btn-secondary" type="button">Invite</button>
    <button class="btn" type="button">Export</button>
  </div>
</div>

<div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
  <section class="rounded-xl border border-slate-800 bg-slate-900/40">
    <header class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Plan 2D</h2>
      <div class="flex gap-2 text-xs text-slate-400">
        <span>Snap</span>
        <span>Grid 100mm</span>
      </div>
    </header>
    <div class="relative">
      <canvas
        #planCanvas
        class="h-[520px] w-full cursor-crosshair bg-slate-950"
        (pointermove)="onCanvasPointer($event)"
        width="1200"
        height="800"
      ></canvas>
      <div *ngFor="let cursor of (cursors$ | async) | keyvalue" class="pointer-events-none absolute" [style.left.px]="cursor.value.x" [style.top.px]="cursor.value.y">
        <span class="rounded bg-black/70 px-2 py-1 text-xs" [style.borderColor]="cursor.value.color" [style.borderWidth.px]="2" [style.borderStyle]="'solid'">
          {{ cursor.value.name }}
        </span>
      </div>
    </div>
  </section>

  <section class="rounded-xl border border-slate-800 bg-slate-900/40">
    <header class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Scene 3D</h2>
      <div class="flex gap-2 text-xs text-slate-400">
        <span>Sunset</span>
        <span>Gizmo</span>
      </div>
    </header>
    <canvas #sceneCanvas class="h-[520px] w-full bg-slate-950"></canvas>
  </section>
</div>

<section class="mt-6 grid gap-6 lg:grid-cols-2">
  <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
    <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Timeline</h3>
    <p class="mt-4 text-sm text-slate-500">Activity feed and autosave history coming soon.</p>
  </div>
  <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
    <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Comments</h3>
    <p class="mt-4 text-sm text-slate-500">Pin notes to selections in 2D or 3D.</p>
  </div>
</section>
